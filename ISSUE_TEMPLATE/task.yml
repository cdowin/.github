name: Task
description: One step of a feature. One branch, one pull request.
body:
  - type: markdown
    attributes:
      value: Set the milestone of the parent feature on this issue. Milestones do not pass down to sub-issues.
  - type: input
    id: parent
    attributes:
      label: Parent feature
      description: The number of the feature this task belongs to.
      placeholder: "#42"
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: What you can see or run to know it works.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: The steps, in order, as a checklist. Required before the task is marked ready. Update it while you work.
      placeholder: |
        - [ ] 
  - type: textarea
    id: files
    attributes:
      label: Files
      description: The files the task may touch. Required before the task is marked ready.
  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: The test or golden file that proves it, and the command that runs it. Required before the task is marked ready.
  - type: input
    id: tier
    attributes:
      label: Tier
      description: The model tier, by oracle coverage (agentic-sdlc AGENTS-AND-MODELS.md). Required before the task is marked ready.
